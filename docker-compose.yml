version: "3.9"

services:
  backend:
    build: .
    container_name: pulseml-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - DATABASE_URL=sqlite:///./data/pulseml.db
      - ALLOWED_ORIGINS=http://localhost:5173
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-prod}
    volumes:
      - pulseml-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: node:20-alpine
    container_name: pulseml-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pulseml-data:
